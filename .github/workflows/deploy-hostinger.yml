
name: Deploy CareCradle to Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: carecradle-hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy CareCradle
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Configure SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check production connection
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$HOSTINGER_PORT" \
            "$HOSTINGER_USER@$HOSTINGER_HOST" \
            'test -f ~/carecradle/carecradle-fixed/artisan &&
             test -f ~/carecradle/carecradle-fixed/.env &&
             test -d ~/carecradle/carecradle-fixed/vendor &&
             echo "Production checks passed"'

      - name: Deploy application files
        run: |
          set -eu
          rsync -rltz \
            --omit-dir-times \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='storage/' \
            --exclude='.env*' \
            --exclude='public/hot' \
            --exclude='public/storage' \
            --exclude='public/build/' \
            --exclude='bootstrap/cache/' \
            --exclude='database/*.sqlite' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $HOSTINGER_PORT" \
            ./ \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/home/u756517879/carecradle/carecradle-fixed/"

      - name: Deploy built assets to Laravel
        run: |
          set -eu
          rsync -rltz --omit-dir-times \
            -e "ssh -i ~/.ssh/id_ed25519 -p $HOSTINGER_PORT" \
            public/build/ \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/home/u756517879/carecradle/carecradle-fixed/public/build/"

      - name: Deploy built assets to website webroot
        run: |
          set -eu
          rsync -rltz --omit-dir-times \
            -e "ssh -i ~/.ssh/id_ed25519 -p $HOSTINGER_PORT" \
            public/build/ \
            "$HOSTINGER_USER@$HOSTINGER_HOST:/home/u756517879/domains/cornflowerblue-turtle-703440.hostingersite.com/public_html/build/"
