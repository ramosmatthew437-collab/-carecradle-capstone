name: Deploy CareCradle to Hostinger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carecradle-hostinger-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build production assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: carecradle-production-build
          path: public/build/
          if-no-files-found: error
          retention-days: 1
